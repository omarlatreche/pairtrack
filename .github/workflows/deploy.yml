name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never deploy a build that CI would reject.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build for Pages
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        # Project sites are served from /<repo>/ — set base accordingly.
        # For Cloudflare Pages (BRIEF §8 option C) use PAIRTRACK_BASE=/ instead.
        env:
          PAIRTRACK_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Add .nojekyll
        run: touch dist/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
